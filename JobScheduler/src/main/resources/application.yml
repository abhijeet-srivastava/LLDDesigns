server:
  port: 8080

spring:
  application:
    name: job-scheduler
  datasource:
    url: jdbc:h2:mem:jobscheduler;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jobscheduler:
  poller:
    fixed-delay-ms: 15000
    lookahead-minutes: 1
  worker:
    pool-size: 4